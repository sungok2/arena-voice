name: ARMY AI Academy Android emulator smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-android-smoke.yml'
  pull_request:
    paths:
      - 'android-army-academy/**'
      - '.github/workflows/academy-android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify app-only crash filter
        run: bash android-army-academy/qa/emulator_smoke.sh --self-test
      - name: Build debug APK for emulator
        working-directory: android-army-academy
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, restart and capture emulator screenshot
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash android-army-academy/qa/emulator_smoke.sh
      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ARMY-AI-ACADEMY-2.6.0-EMULATOR-SMOKE-EVIDENCE
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 7
