name: ARMY AI Academy Android emulator smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build debug APK for emulator
        working-directory: android-army-academy
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, restart and capture emulator screenshot
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            mkdir -p smoke-evidence
            adb install -r android-army-academy/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.sungok2.armyaiacademy/.MainActivity | tee smoke-evidence/start.txt
            sleep 12
            adb shell pidof com.sungok2.armyaiacademy | tee smoke-evidence/process.txt
            adb shell screencap -p /sdcard/academy-home.png
            adb pull /sdcard/academy-home.png smoke-evidence/home.png
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml smoke-evidence/window.xml || true
            adb shell am force-stop com.sungok2.armyaiacademy
            adb shell am start -W -n com.sungok2.armyaiacademy/.MainActivity | tee smoke-evidence/restart.txt
            sleep 3
            adb shell pidof com.sungok2.armyaiacademy | tee smoke-evidence/restart-process.txt
            adb logcat -d -b crash > smoke-evidence/crash-log.txt
            if grep -E 'FATAL EXCEPTION|Process: com.sungok2.armyaiacademy' smoke-evidence/crash-log.txt; then
              echo "::error::Android runtime crash found"
              exit 1
            fi
      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ARMY-AI-ACADEMY-2.0.0-EMULATOR-SMOKE-EVIDENCE
          path: smoke-evidence/
          if-no-files-found: warn
          retention-days: 7
