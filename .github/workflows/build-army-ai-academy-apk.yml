name: Build Army AI Academy Android release preview

on:
  push:
    branches: [main]
    paths:
      - 'android-army-academy/**'
      - '.github/workflows/build-army-ai-academy-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: JavaScript syntax verification
        run: |
          for p in app.js data_core.js data_assessment.js data_plan.js; do
            node --check "android-army-academy/app/src/main/assets/$p"
          done

      - name: Course content and time allocation audit
        run: python3 android-army-academy/qa/content_audit.py

      - name: Optional production signing setup
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ACADEMY_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ACADEMY_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ACADEMY_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ACADEMY_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/army-academy-release.jks"
            echo "ACADEMY_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/army-academy-release.jks" >> "$GITHUB_ENV"
            echo "ACADEMY_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ACADEMY_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ACADEMY_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Release signing: persistent key from encrypted GitHub Actions secrets"
          else
            echo "Release signing: evaluation-only development key (NOT production signing)"
          fi

      - name: Android lint, build and package
        working-directory: android-army-academy
        run: gradle :app:lintRelease :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Validate release APK manifest, signature and SHA256
        run: |
          APK=android-army-academy/app/build/outputs/apk/release/app-release.apk
          echo '=== APK metadata ==='
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E '^package:|^sdkVersion:|^targetSdkVersion:'
          echo '=== APK signature ==='
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo '=== SHA256 ==='
          sha256sum "$APK"
          sha256sum android-army-academy/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload preview-installable release APK
        uses: actions/upload-artifact@v6
        with:
          name: ARMY-AI-ACADEMY-v2-RC3-RELEASE-PREVIEW
          path: android-army-academy/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug APK for QA
        uses: actions/upload-artifact@v6
        with:
          name: ARMY-AI-ACADEMY-v2-RC3-DEBUG-QA
          path: android-army-academy/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
