name: Build Army AI Excellence Academy APK
on:
  push:
    branches: [main]
    paths:
      - 'android-army-academy/**'
      - '.github/workflows/build-army-ai-academy-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Verify offline educational UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android-army-academy/app/src/main/assets/index.html').read_text(encoding='utf-8')
          assert 'ARMY AI EXCELLENCE ACADEMY' in s
          assert '12주' in s and '42개 과목' in s
          assert 'ArmyNative.saveJson' in s
          assert '<script src="http' not in s
          print('Offline educational HTML checked:',len(s),'characters')
          PY
      - name: Build Android debug APK
        working-directory: android-army-academy
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Print APK SHA256
        run: sha256sum android-army-academy/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ARMY-AI-EXCELLENCE-ACADEMY-1.0-RC1-debug
          path: android-army-academy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
