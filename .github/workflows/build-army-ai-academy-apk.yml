name: ARMY AI Academy Debug QA (not distributable)

on:
  push:
    branches: [main]
    paths:
      - 'android-army-academy/**'
      - '.github/workflows/build-army-ai-academy-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Static and data validation
        run: |
          for p in app.js data_core.js data_assessment.js data_plan.js lesson_df001.js lesson_df_expansion.js lesson_at_expansion.js lesson_sp_expansion.js pilot_labs.js; do node --check "android-army-academy/app/src/main/assets/$p"; done
          node android-army-academy/qa/backup_test.js
          node android-army-academy/qa/lesson_reader_test.js
          node android-army-academy/qa/practical_lab_test.js
          python3 android-army-academy/qa/content_audit.py
          python3 android-army-academy/qa/content_252_audit.py
          python3 android-army-academy/qa/educational_quality_gate.py
          python3 android-army-academy/qa/quality_gate.py
          python3 android-army-academy/qa/release_gate.py
      - name: Lint and debug build
        working-directory: android-army-academy
        run: gradle :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: ARMY-AI-ACADEMY-2.3.0-rc2-DEBUG-ONLY-DO-NOT-DISTRIBUTE
          path: android-army-academy/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
