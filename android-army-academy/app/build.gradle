plugins {
    id 'com.android.application'
}

def persistentStore = System.getenv('ACADEMY_RELEASE_KEYSTORE_PATH')
def previewStore = System.getenv('ACADEMY_PREVIEW_KEYSTORE_PATH')

android {
    namespace 'com.sungok2.armyaiacademy'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sungok2.armyaiacademy'
        minSdk 26
        targetSdk 36
        versionCode 19
        versionName '2.5.0'
    }

    signingConfigs {
        // CI's ephemeral test-only signing identity. Never use this variant for
        // a production update or publish it as the owner-signed release APK.
        if (previewStore) {
            preview {
                storeFile file(previewStore)
                storePassword System.getenv('ACADEMY_PREVIEW_STORE_PASSWORD')
                keyAlias System.getenv('ACADEMY_PREVIEW_KEY_ALIAS')
                keyPassword System.getenv('ACADEMY_PREVIEW_KEY_PASSWORD')
            }
        }
        if (persistentStore) {
            production {
                storeFile file(persistentStore)
                storePassword System.getenv('ACADEMY_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('ACADEMY_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('ACADEMY_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Without a managed persistent keystore this build is an evaluation APK,
            // not an approved production distribution signing identity.
            if (persistentStore) signingConfig signingConfigs.production
            minifyEnabled false
            debuggable false
        }
        preview {
            initWith release
            // Separate install identity prevents clobbering production/debug apps.
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            if (previewStore) signingConfig signingConfigs.preview
            // No debugging despite ephemeral test signing.
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.activity:activity:1.13.0'
}
